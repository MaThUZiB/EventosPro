{% extends "administrador/admin_core.html" %}

{% block content %}
<div class="max-w-lg mx-auto mt-20 bg-gray-900 p-6 rounded-xl border border-gray-800 text-center">
    <h1 class="text-2xl font-bold text-gray-200 mb-4">Eliminar Ubicación</h1>
    
    {% if error %}
        <p class="text-red-500 font-semibold mb-4">{{ error }}</p>
    {% else %}
        <p class="text-gray-300 mb-6">
            ¿Estás seguro que deseas eliminar la ubicación 
            <span class="font-semibold text-white">{{ ubicacion.nombre }}</span>?
        </p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="flex justify-center gap-4">
            <button type="submit" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg">
                Eliminar
            </button>
            <a href="{% url 'administrador:listar_ubicaciones_admin' %}" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
