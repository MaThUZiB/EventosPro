{% extends "administrador/admin_core.html" %}

{% block content %}

<div class="bg-gray-900 border border-gray-800 p-8 rounded-xl max-w-lg mx-auto mt-10">
    <h2 class="text-xl font-bold text-red-400 mb-4">Eliminar Usuario</h2>

    <p class="text-gray-300 mb-6">
        ¿Estás seguro que deseas activar al usuario  
        <span class="text-white font-semibold">{{ usuario.username }}</span>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="flex justify-between">
            <a href="{% url 'administrador:listar_usuarios_admin' %}" 
               class="px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded-lg">
                Cancelar
            </a>

            <button class="px-4 py-2 bg-green-600 hover:bg-green-500 text-white rounded-lg">
                Activar
            </button>
        </div>
    </form>

</div>

{% endblock %}
